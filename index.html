<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Preview Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "container">

        <img src = "images/drawers.jpg" class = "preview-image">

        <div class = "content">

            <h1 class = "title">Shift the overall look and feel by adding these wonderful touches to furniture in your home</h1>

            <p>Ever been in a room and feel like something was missing?
                Perhaps it felt slightly bare and uninviting. I've got some simple tips to make any room feel complete.</p>

            <div class = "about">
                
                <img src = "images/avatar-michelle.jpg" class = "pfp">

                <div class = "info">
                    <p id = "name">Michelle Appleton</p>
                    <p id = "date">28 June 2020</p>
                </div>

                <button id = "share"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="13"><path fill="hsl(210, 46%, 95%)" d="M15 6.495L8.766.014V3.88H7.441C3.33 3.88 0 7.039 0 10.936v2.049l.589-.612C2.59 10.294 5.422 9.11 8.39 9.11h.375v3.867L15 6.495z"/></svg></button>

                <div id = "popup">
                    <div id = "popup-text"> SHARE </div>
                    <button class = "social" id = "facebook"><img src = "images/icon-facebook.svg"></button>
                    <button class = "social" id = "twitter"><img src = "images/icon-twitter.svg"></button>
                    <button class = "social" id = "pinterest"><img src = "images/icon-pinterest.svg"></button>               
                </div>
            </div>
        </div>
    </div>

    

    
    <script src="script.js"></script>
